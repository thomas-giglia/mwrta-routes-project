<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWRTA Route Map - MetroWest Regional Transit Authority</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fb;
            --bg-hover: #f0f2f5;
            --bg-selected: #e8f0fe;
            --text-primary: #1a1a2e;
            --text-secondary: #5f6368;
            --text-muted: #9aa0a6;
            --border: #e2e5e9;
            --shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
            --accent: #4363d8;
            --accent-soft: #e8f0fe;
            --radius: 12px;
            --radius-sm: 6px;
            --transition: 0.2s ease;
        }
        [data-theme="dark"] {
            --bg-primary: #1e1e2e;
            --bg-secondary: #262637;
            --bg-hover: #2e2e42;
            --bg-selected: #2d3a5c;
            --text-primary: #e2e4e9;
            --text-secondary: #a0a4ad;
            --text-muted: #6c7086;
            --border: #363649;
            --shadow: 0 4px 24px rgba(0,0,0,0.4), 0 1px 4px rgba(0,0,0,0.2);
            --accent: #7289da;
            --accent-soft: #2d3a5c;
            --radius: 12px;
            --radius-sm: 6px;
        }
        [data-theme="evil"] {
            --bg-primary: #1a0a0a;
            --bg-secondary: #2a0f0f;
            --bg-hover: #3d1515;
            --bg-selected: #4a1a1a;
            --text-primary: #ff4444;
            --text-secondary: #cc3333;
            --text-muted: #882222;
            --border: #4a1111;
            --shadow: 0 4px 24px rgba(255,0,0,0.2), 0 0 40px rgba(255,0,0,0.05);
            --accent: #ff2222;
            --accent-soft: #3d1111;
            --radius: 12px;
            --radius-sm: 6px;
        }
        [data-theme="evil"] .sidebar {
            background: linear-gradient(180deg, #1a0a0a 0%, #0d0505 100%);
            border-color: #661111;
        }
        [data-theme="evil"] .sidebar h1 { text-shadow: 0 0 8px rgba(255,0,0,0.6); }
        [data-theme="evil"] .route-badge { box-shadow: 0 0 6px rgba(255,0,0,0.3); }
        [data-theme="evil"] .theme-toggle { border-color: #661111; }
        [data-theme="evil"] .theme-toggle:hover { border-color: #ff2222; box-shadow: 0 0 10px rgba(255,0,0,0.4); }
        [data-theme="evil"] .btn:hover { border-color: #ff2222; box-shadow: 0 0 6px rgba(255,0,0,0.3); }
        [data-theme="evil"] .dir-btn.active-dir { background: #cc0000 !important; border-color: #cc0000 !important; box-shadow: 0 0 8px rgba(255,0,0,0.5) !important; }
        [data-theme="evil"] .leaflet-control-layers { background: #1a0a0a; color: #ff4444; border-color: #4a1111; }
        [data-theme="evil"] .leaflet-control-zoom a { background: #1a0a0a; color: #ff4444; border-color: #4a1111; }
        [data-theme="evil"] .leaflet-control-zoom a:hover { background: #3d1515; }
        [data-theme="evil"] .leaflet-bar { border-color: #4a1111; }
        [data-theme="evil"] .leaflet-popup-content-wrapper { background: #1a0a0a; color: #ff4444; }
        [data-theme="evil"] .leaflet-popup-tip { background: #1a0a0a; }
        [data-theme="evil"] .leaflet-tile-pane { filter: hue-rotate(-30deg) saturate(2) brightness(0.7); }
        [data-theme="evil"] .sidebar::-webkit-scrollbar-thumb { background: #661111; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; transition: background var(--transition); }
        #map { height: 100vh; width: 100%; }
        .sidebar {
            position: absolute; top: 12px; left: 12px; z-index: 1000;
            background: var(--bg-primary); border-radius: var(--radius);
            box-shadow: var(--shadow); border: 1px solid var(--border);
            padding: 18px; max-height: calc(100vh - 24px); overflow-y: auto; width: 340px;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .sidebar h1 { font-size: 15px; font-weight: 700; margin-bottom: 2px; color: var(--text-primary); letter-spacing: -0.3px; }
        .sidebar h2 { font-size: 11px; font-weight: 400; color: var(--text-muted); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .route-item {
            display: flex; align-items: center; padding: 7px 10px; margin: 1px 0;
            border-radius: var(--radius-sm); transition: background var(--transition);
        }
        .route-item:hover { background: var(--bg-hover); }
        .route-item.selected { background: var(--bg-selected); }
        .route-checkbox {
            margin-right: 8px; cursor: pointer; width: 15px; height: 15px;
            accent-color: var(--accent);
        }
        .route-badge {
            min-width: 36px; height: 22px; border-radius: var(--radius-sm); display: flex;
            align-items: center; justify-content: center; font-size: 10px;
            font-weight: 700; color: white; margin-right: 10px; padding: 0 5px;
            letter-spacing: 0.3px;
        }
        .route-name { font-size: 12px; color: var(--text-secondary); line-height: 1.4; cursor: pointer; font-weight: 400; }
        .route-clickable { display: flex; align-items: center; cursor: pointer; flex: 1; }
        .legend-toggle {
            display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
            font-size: 12px; color: var(--text-secondary); cursor: pointer;
        }
        .legend-toggle input { cursor: pointer; accent-color: var(--accent); }
        .controls { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .controls .legend-toggle { width: 100%; margin-top: 4px; margin-bottom: 2px; }
        .btn {
            font-size: 11px; font-weight: 500; padding: 5px 12px; border: 1px solid var(--border);
            border-radius: var(--radius-sm); background: var(--bg-secondary); color: var(--text-primary);
            cursor: pointer; transition: all var(--transition);
        }
        .btn:hover { background: var(--bg-hover); border-color: var(--accent); }
        .dir-btn { font-size: 10px !important; padding: 4px 8px !important; font-weight: 500 !important; }
        .directional-marker { visibility: hidden; }
        .dir-btn.active-dir { background: var(--accent) !important; color: white !important; border-color: var(--accent) !important; }
        .leaflet-top.leaflet-right { display: flex; flex-direction: row; align-items: flex-start; gap: 6px; }
        .theme-toggle {
            display: flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--bg-secondary);
            cursor: pointer; transition: all var(--transition); font-size: 16px;
            margin-left: auto;
        }
        .theme-toggle:hover { border-color: var(--accent); background: var(--bg-hover); }
        [data-theme="dark"] .leaflet-control-layers {
            background: var(--bg-primary); color: var(--text-primary); border-color: var(--border);
        }
        [data-theme="dark"] .leaflet-control-zoom a {
            background: var(--bg-primary); color: var(--text-primary); border-color: var(--border);
        }
        [data-theme="dark"] .leaflet-control-zoom a:hover { background: var(--bg-hover); }
        [data-theme="dark"] .leaflet-bar { border-color: var(--border); }
        [data-theme="dark"] .leaflet-popup-content-wrapper {
            background: var(--bg-primary); color: var(--text-primary);
        }
        [data-theme="dark"] .leaflet-popup-tip { background: var(--bg-primary); }
        .inverted-tiles { filter: invert(1) hue-rotate(180deg) contrast(0.7) brightness(1.3); }
        .stop-number, .stop-label, .directional-marker, .leaflet-tooltip,
        .leaflet-popup-content, .leaflet-control-layers {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .leaflet-tooltip {
            border-radius: var(--radius-sm); padding: 4px 8px; font-size: 12px; font-weight: 500;
        }
        .sidebar-toggle {
            position: absolute; top: 12px; left: 12px; z-index: 1001;
            width: 36px; height: 36px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--bg-primary);
            box-shadow: var(--shadow); cursor: pointer; display: none;
            align-items: center; justify-content: center; font-size: 18px;
            color: var(--text-primary); transition: all var(--transition);
        }
        .sidebar-toggle:hover { background: var(--bg-hover); border-color: var(--accent); }
        .sidebar.collapsed { display: none; }
        .sidebar.collapsed ~ .sidebar-toggle { display: flex; }
        .trip-planner-header {
            display: flex; align-items: center; justify-content: space-between; cursor: pointer;
        }
        .trip-planner-header h3 { margin: 0; font-size: 14px; color: var(--text-primary); }
        .trip-planner-body.collapsed { display: none; }
        .collapse-arrow {
            font-size: 12px; color: var(--text-muted); transition: transform var(--transition);
            margin-left: 8px;
        }
        .collapse-arrow.rotated { transform: rotate(-90deg); }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        @media (max-width: 768px) {
            .sidebar {
                width: calc(100vw - 24px); max-width: 340px;
                max-height: 60vh;
            }
            .sidebar-toggle { display: flex; }
            .sidebar:not(.collapsed) ~ .sidebar-toggle { display: none; }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="Show sidebar">&#9776;</button>
    <div class="sidebar">
        <div style="display:flex;align-items:center;justify-content:space-between;">
            <div><h1>MWRTA Fixed Routes</h1>
            <h2>MetroWest Regional Transit Authority</h2></div>
            <button class="sidebar-toggle" style="position:static;display:flex;width:28px;height:28px;font-size:14px;box-shadow:none;" onclick="toggleSidebar()" title="Hide sidebar">&times;</button>
        </div>
        <div class="controls">
            <button class="btn" onclick="showAll()">Show All</button>
            <button class="btn" onclick="hideAll()">Hide All</button>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode" id="theme-btn">&#9790;</button>
            <label class="legend-toggle">
                <input type="checkbox" id="showStops" checked onchange="toggleStops()"> Show Stop Markers
            </label>
            <label class="legend-toggle">
                <input type="checkbox" id="showOrphans" onchange="toggleOrphanStops()"> Show Orphan Stops
            </label>
            <label class="legend-toggle">
                <input type="checkbox" id="showBuses" checked onchange="toggleLiveBuses()"> Show MWRTA Buses
            </label>
            <label class="legend-toggle">
                <input type="checkbox" id="showMbtaBuses" checked onchange="toggleMbtaBuses()"> Show MBTA Buses
            </label>
        </div>
        <div id="route-list"></div>
        <div class="trip-planner" id="tripPlanner" style="margin-top:16px;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-secondary);">
            <div class="trip-planner-header" onclick="toggleTripPlanner()">
                <h3><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#27ae60;margin-right:4px;animation:pulse 2s infinite;"></span>Trip Planner (Live)</h3>
                <span class="collapse-arrow" id="tripPlannerArrow">&#9660;</span>
            </div>
            <div class="trip-planner-body" id="tripPlannerBody">
            <label style="font-size:11px;color:var(--text-secondary);display:block;margin-bottom:3px;margin-top:10px;">From</label>
            <input type="text" id="tripFromAddress" placeholder="Type an address or location..." style="width:100%;box-sizing:border-box;padding:6px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:4px;background:var(--bg-primary);color:var(--text-primary);">
            <select id="tripFrom" style="width:100%;padding:6px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;background:var(--bg-primary);color:var(--text-primary);"><option value="">— or pick a stop —</option></select>
            <label style="font-size:11px;color:var(--text-secondary);display:block;margin-bottom:3px;">To</label>
            <input type="text" id="tripToAddress" placeholder="Type an address or location..." style="width:100%;box-sizing:border-box;padding:6px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:4px;background:var(--bg-primary);color:var(--text-primary);">
            <select id="tripTo" style="width:100%;padding:6px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;background:var(--bg-primary);color:var(--text-primary);"><option value="">— or pick a stop —</option></select>
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
                <select id="tripTimeMode" style="width:auto;flex:0 0 auto;padding:6px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-primary);color:var(--text-primary);">
                    <option value="depart">Depart at</option>
                    <option value="arrive">Arrive by</option>
                </select>
                <input type="time" id="tripTime" style="flex:1;padding:6px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-primary);color:var(--text-primary);">
                <button class="btn" style="margin:0;flex:0 0 auto;padding:6px 10px;" onclick="document.getElementById('tripTime').value='';planTripStops();" title="Reset to now">Now</button>
            </div>
            <button class="btn" style="width:100%;padding:9px;background:var(--accent);color:white;border-color:var(--accent);font-weight:600;" onclick="planTripStops()">Find Routes</button>
            <div id="tripResults" style="margin-top:12px;"></div>
            </div>
        </div>
    </div>
    <script src="schedule_data.js"></script>
    <script src="data/shapes.js"></script>
    <script src="data/routes.js"></script>
    <script src="data/vc-routes.js"></script>
    <script src="data/trips.js"></script>
    <script src="js/app.js"></script>
    <script src="js/live-buses.js"></script>
    <script src="js/trip-planner.js"></script>
</body>
</html>
